name: release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - { name: linux-x64, flag: bun-linux-x64 }
          - { name: linux-arm64, flag: bun-linux-arm64 }
          - { name: darwin-x64, flag: bun-darwin-x64 }
          - { name: darwin-arm64, flag: bun-darwin-arm64 }
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Build ${{ matrix.target.name }}
        run: |
          mkdir -p dist
          bun build --compile --minify --sourcemap \
            --target=${{ matrix.target.flag }} \
            src/cli.ts \
            --outfile=dist/pkgstate-${{ matrix.target.name }}
      - uses: actions/upload-artifact@v4
        with:
          name: pkgstate-${{ matrix.target.name }}
          path: dist/pkgstate-${{ matrix.target.name }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Generate checksums
        run: |
          cd dist
          sha256sum pkgstate-* > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/pkgstate-*
            dist/SHA256SUMS
          generate_release_notes: true
