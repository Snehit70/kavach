name: release

on:
  push:
    tags:
      - "v*"

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3
      - run: bun install --frozen-lockfile
      - name: Tag matches package.json and CHANGELOG
        run: bun scripts/release.ts verify "$GITHUB_REF_NAME"
      - run: bun run check

  build:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        target:
          - { name: linux-x64, flag: bun-linux-x64 }
          - { name: linux-arm64, flag: bun-linux-arm64 }
          - { name: darwin-x64, flag: bun-darwin-x64 }
          - { name: darwin-arm64, flag: bun-darwin-arm64 }
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3
      - run: bun install --frozen-lockfile
      - name: Build ${{ matrix.target.name }}
        run: |
          mkdir -p dist
          bun build --compile --minify --sourcemap \
            --target=${{ matrix.target.flag }} \
            src/cli.ts \
            --outfile=dist/kavach-${{ matrix.target.name }}
      - uses: actions/upload-artifact@v4
        with:
          name: kavach-${{ matrix.target.name }}
          path: dist/kavach-${{ matrix.target.name }}
      - name: Smoke test
        if: matrix.target.name == 'linux-x64'
        run: |
          out=$(./dist/kavach-linux-x64 --version)
          echo "$out"
          test "$out" = "kavach ${GITHUB_REF_NAME#v}"

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3
      - name: Release notes from CHANGELOG
        run: bun scripts/release.ts notes "${GITHUB_REF_NAME#v}" > NOTES.md
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Generate checksums
        run: |
          cd dist
          sha256sum kavach-* > SHA256SUMS
      - uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/kavach-*
            dist/SHA256SUMS
          body_path: NOTES.md
          prerelease: ${{ contains(github.ref_name, '-') }}
